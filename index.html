<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pinhead Games"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest">
<title>Pinhead Games</title>
<style>:root{--bg:#050812;--bg2:#0b1222;--card:rgba(15,23,42,.88);--card2:rgba(8,15,28,.94);--line:rgba(148,163,184,.18);--line2:rgba(148,163,184,.09);--text:#f8fafc;--muted:#94a3b8;--accent:#67e8f9;--accent2:#60a5fa;--good:#86efac;--danger:#fb7185;--gold:#fbbf24;--shadow:0 22px 60px rgba(0,0,0,.32);--shadow-soft:0 10px 30px rgba(0,0,0,.18);--radius:20px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 8% -8%,rgba(103,232,249,.12),transparent 25%),radial-gradient(circle at 94% 8%,rgba(96,165,250,.11),transparent 24%),radial-gradient(circle at 50% 100%,rgba(134,239,172,.05),transparent 30%),linear-gradient(180deg,#040712 0%,#08101d 48%,#0b1323 100%);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 0 97%,rgba(255,255,255,.012) 100%)}
main{max-width:1220px;margin:auto;padding:18px 18px 64px}
header{position:relative;padding:20px 8px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
header:after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:linear-gradient(90deg,rgba(103,232,249,.45),rgba(96,165,250,.12),transparent)}
header h1{display:flex;align-items:center;gap:10px;margin:0;font-size:36px;line-height:1;letter-spacing:-.045em}
header h1:first-letter{filter:drop-shadow(0 4px 12px rgba(103,232,249,.35))}
header .muted{margin-top:7px;letter-spacing:.02em}
h2{font-size:20px;line-height:1.15;margin:0 0 10px;letter-spacing:-.015em}
h3{font-size:16px;margin:0 0 7px}
.muted{color:var(--muted);font-size:13px}
button,input,select{font:inherit}
button{padding:11px 15px;border-radius:12px;border:1px solid rgba(148,163,184,.18);background:linear-gradient(180deg,#263650,#18263e);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 7px 20px rgba(0,0,0,.18);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,filter .16s ease}
button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,.24);border-color:rgba(103,232,249,.32);filter:brightness(1.04)}
button:active{transform:translateY(0)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.active,button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#041019;border-color:transparent;box-shadow:0 10px 28px rgba(96,165,250,.24)}
button.good{background:linear-gradient(135deg,#18804b,#12623a);border-color:rgba(134,239,172,.2)}
button.danger{background:linear-gradient(135deg,#6a263d,#461b2b);border-color:rgba(251,113,133,.2)}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(20,30,50,.94),rgba(10,18,33,.92));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:16px 0;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,rgba(103,232,249,.3),rgba(96,165,250,.12),transparent 70%);pointer-events:none}
.card>h2{display:flex;align-items:center;gap:9px}
.card>h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(148,163,184,.13),transparent);margin-left:6px}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.input,select{width:100%;padding:11px 13px;background:linear-gradient(180deg,rgba(9,17,31,.98),rgba(7,13,25,.98));border:1px solid rgba(148,163,184,.18);color:#fff;border-radius:12px;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
.input:hover,select:hover{border-color:rgba(103,232,249,.28)}
.input:focus,select:focus{border-color:rgba(103,232,249,.55);box-shadow:0 0 0 4px rgba(103,232,249,.08),inset 0 1px 0 rgba(255,255,255,.03)}
.input::placeholder{color:#64748b}
.players .input{height:48px;font-weight:750;letter-spacing:.01em}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.hidden{display:none!important}
.tabs{display:flex;gap:7px;position:sticky;top:8px;z-index:40;background:rgba(5,9,18,.72);padding:6px;border:1px solid rgba(148,163,184,.17);border-radius:16px;backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.24);margin:12px 0 10px}
.tabs button{flex:1;border-color:transparent;background:transparent;box-shadow:none;border-radius:11px;padding:12px 14px;color:var(--muted);font-weight:900;letter-spacing:.01em}
.tabs button:hover{background:rgba(255,255,255,.045);color:var(--text);transform:none;filter:none}
.tabs button.active{background:linear-gradient(135deg,rgba(103,232,249,.98),rgba(96,165,250,.96));color:#041019;box-shadow:0 8px 22px rgba(96,165,250,.2)}
.objective{position:relative;border:1px solid rgba(148,163,184,.16);border-radius:16px;background:linear-gradient(145deg,rgba(14,24,42,.92),rgba(9,16,29,.94));padding:14px;margin:11px 0;box-shadow:var(--shadow-soft);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.objective:has(.tipwrap:hover),.objective:has(.tipwrap:focus-within),.objective:has(.tipwrap.open){z-index:100}
.objective:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:16px 0 0 16px;background:linear-gradient(180deg,var(--accent),rgba(96,165,250,.15))}
.objective:hover{border-color:rgba(103,232,249,.25);transform:translateY(-1px);box-shadow:0 15px 35px rgba(0,0,0,.2)}
.objtop{display:grid;grid-template-columns:50px 1.25fr 1.7fr 1fr 1fr 1fr 1fr;gap:11px;align-items:center}
.num{font-size:24px;font-weight:950;text-align:center;color:var(--accent);text-shadow:0 0 20px rgba(103,232,249,.18)}
.game{font-weight:900;letter-spacing:-.015em}
.how{color:#cbd5e1;font-size:12px;line-height:1.45}
.result select{text-align:center;font-weight:850}
.scoregrid{overflow:auto}
.table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;border:1px solid rgba(148,163,184,.15);border-radius:15px;overflow:hidden;background:rgba(6,12,23,.78)}
.table th,.table td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:10px 9px;text-align:center}
.table th:last-child,.table td:last-child{border-right:0}
.table tr:last-child td{border-bottom:0}
.table th{color:#aebbd0;background:rgba(18,29,49,.98);font-size:11px;letter-spacing:.075em;text-transform:uppercase;position:sticky;top:0;z-index:2}
.table td:first-child,.table th:first-child{text-align:left}
.table tbody tr:nth-child(even) td{background:rgba(255,255,255,.016)}
.table tbody tr:hover td{background:rgba(103,232,249,.035)}
.table tbody tr:last-child td{background:rgba(103,232,249,.035)}
.total{font-weight:950;color:var(--accent);font-size:15px}
.bowl-head{display:grid;grid-template-columns:78px 1fr 115px;gap:11px;align-items:center}
.bgame-line{display:flex;align-items:center;gap:7px}
.tipwrap{position:relative;display:inline-block}
.tipbtn{padding:4px 8px;border-radius:999px;font-size:12px;line-height:1;border:1px solid rgba(103,232,249,.22);background:rgba(19,34,57,.92);color:#fff;box-shadow:none}
.tipbtn:hover{box-shadow:0 5px 16px rgba(103,232,249,.14);transform:translateY(-1px)}
.tipbox{display:none;position:absolute;left:0;top:34px;z-index:80;width:min(380px,calc(100vw - 30px));max-height:min(72vh,560px);overflow:auto;background:linear-gradient(180deg,#0c1729,#081222);border:1px solid rgba(103,232,249,.18);border-radius:14px;padding:13px;box-shadow:0 20px 55px rgba(0,0,0,.44);text-align:left}
.tipwrap.open .tipbox{display:block}.tipwrap.closed .tipbox{display:none!important}@media(max-width:600px){#bowlingFrames .tipbox{position:fixed;left:12px;right:12px;top:50%;transform:translateY(-50%);width:auto;max-height:75vh;z-index:9999;box-shadow:0 0 0 100vmax rgba(0,0,0,.68),0 20px 55px rgba(0,0,0,.55)}#bowlingFrames .tipwrap.open{z-index:10000}}
.tiphead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:7px}.tiphead h4{margin:0;flex:1}.tipclose{padding:5px 9px;border-radius:8px;font-size:11px;line-height:1;background:#263650;border:1px solid rgba(148,163,184,.25);box-shadow:none;flex-shrink:0}
.tipbox h4{margin:0 0 7px;font-size:13px;color:#e8f9ff}.tipbox table{width:100%;border-collapse:collapse;font-size:11px}.tipbox th,.tipbox td{border:1px solid var(--line);padding:4px 5px;text-align:center}.tipbox th{color:var(--muted);background:#111a2c}
.bframe{position:relative;border:1px solid rgba(148,163,184,.16);border-radius:16px;background:linear-gradient(145deg,rgba(14,24,42,.92),rgba(9,16,29,.94));margin:11px 0;padding:13px;box-shadow:var(--shadow-soft)}
.bframe:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:16px 0 0 16px;background:linear-gradient(180deg,rgba(103,232,249,.8),rgba(96,165,250,.08))}
.binputs{display:grid;grid-template-columns:180px repeat(4,1fr);gap:10px;align-items:end}
.playerbox{border:1px solid rgba(148,163,184,.13);border-radius:13px;padding:10px;background:linear-gradient(180deg,rgba(8,16,30,.8),rgba(6,12,23,.78))}
.playerbox label{text-align:center;display:block;font-weight:850;font-size:13px;color:#dce6f6;margin-bottom:7px}
.mini{font-size:11px;color:var(--muted)}
.pinresult{font-size:21px;font-weight:950;text-align:center;margin-top:7px;min-height:29px;letter-spacing:.02em}.strike{color:var(--good);text-shadow:0 0 14px rgba(134,239,172,.16)}.spare{color:var(--accent);text-shadow:0 0 14px rgba(103,232,249,.16)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid var(--line2)}
.winner{color:var(--good);font-size:21px;font-weight:950}
#result{background:linear-gradient(145deg,rgba(16,53,39,.75),rgba(11,28,26,.9));border-color:rgba(134,239,172,.22);box-shadow:0 18px 50px rgba(0,0,0,.25),0 0 45px rgba(134,239,172,.06)}
#status{min-height:20px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid var(--line2)}#splashScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}#splashScreen img{width:100%;height:100%;object-fit:contain;background:#000}#splashScreen.done{opacity:0;visibility:hidden;pointer-events:none}\n.offline-badge{padding:8px 11px;border-radius:999px;border:1px solid rgba(134,239,172,.18);background:rgba(134,239,172,.06);color:#b6f7cc;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.14)}.offline-badge.ready{border-color:rgba(134,239,172,.3);background:rgba(134,239,172,.1);color:var(--good)}.offline-badge.offline{border-color:rgba(103,232,249,.25);background:rgba(103,232,249,.08);color:var(--accent)}
@media(max-width:900px){.objtop{grid-template-columns:42px 1fr 1.4fr}.binputs{grid-template-columns:1fr 1fr}.binputs>:first-child{grid-column:1/-1}}
@media(max-width:760px){main{padding:14px 10px 46px}header{padding:14px 4px 18px;align-items:flex-start}header h1{font-size:31px}.players{grid-template-columns:1fr 1fr}.objtop{grid-template-columns:38px 1fr}.objtop>.how{grid-column:2}.objtop>.result{grid-column:2}.bowl-head{grid-template-columns:58px 1fr 94px}.card{padding:15px}.tabs{top:4px}}
@media(max-width:450px){main{padding:10px 8px 38px}header h1{font-size:28px}.players{grid-template-columns:1fr}.tabs{top:3px}.tabs button{padding:10px 8px}.objective{padding:12px}.objtop{gap:8px}.binputs{grid-template-columns:1fr}.bowl-head{grid-template-columns:1fr}.bowl-head>:last-child{margin-top:4px}.tipbox{left:auto;right:0}}
