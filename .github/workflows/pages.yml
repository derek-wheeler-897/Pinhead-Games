name: Deploy Pinhead Games
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build Pinhead image assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp
          base64 -d assets/pinhead-q80.b64 > pinhead-splash.webp
          convert pinhead-splash.webp -filter Lanczos -resize 192x192^ -gravity center -extent 192x192 -strip -colorspace sRGB icon-192.png
          convert pinhead-splash.webp -filter Lanczos -resize 512x512^ -gravity center -extent 512x512 -strip -colorspace sRGB icon-512.png
          convert pinhead-splash.webp -filter Lanczos -resize 180x180^ -gravity center -extent 180x180 -strip -colorspace sRGB apple-touch-icon.png
          rm -rf assets/pinhead-q80.b64
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4